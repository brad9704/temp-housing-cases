# ---------------------------------------------------------------------------
# stage_ambiguity: stage_hint 'ambiguous' 또는 판정이 갈리는 경우 메모 (분류 프롬프트 지침 후보)
stage_ambiguity:
  - {term: 'hotel/motel programmes (TSA, 二次避難, sistemazione alberghiera, otel konaklama)', candidates: [temporary_sheltering, temporary_housing], note: 'Quarantelli는 일상 가사(취사·자립)가 재개되면 housing. 호텔은 취사 불가지만 수개월 지속(카트리나 TSA, 아마트리체 호텔 1년+). 기간이 아니라 가사 재개 여부로 판정하자는 규칙 필요'}
  - {term: 'host family / relatives (親族宅, allegados, desalojados, akraba yanı)', candidates: [temporary_sheltering, temporary_housing], note: '단기 피신=sheltering, 장기 동거·임대료 분담=housing. 기사에 기간 정보가 드묾'}
  - {term: 'rental subsidy (kira yardımı, CAS, bono de arriendo, 2,500 DH)', candidates: [temporary_housing, none], note: '현금 지원만 언급되고 실제 거주 형태가 불명인 경우 다수. 모로코 2,500DH는 텐트 거주자도 받으므로 housing 근거가 아님'}
  - {term: 'container/tent camps managed long-term (konteyner yaşam alanı, tendopoli 수개월, 텐트촌)', candidates: [temporary_sheltering, temporary_housing], note: '튀르키예 konteyner kent은 가사 재개=housing, 대형 텐트촌(çadır kent)은 sheltering이나 1년 이상 지속 시 혼재'}
  - {term: 'みなし避難所 / 二次避難所', candidates: [emergency_sheltering, temporary_sheltering], note: '행정 명칭은 避難所이나 실태는 숙박시설 장기 체류'}
  - {term: '在宅避難 / 車中泊 / staying in damaged home', candidates: [emergency_sheltering, temporary_sheltering, none], note: '시설 밖 대피. 장소 기반 site 정의와 충돌 — site에 "dispersed" 형태 필요할 수 있음'}
  - {term: '자주피난(自主避難) / 원전 장기피난(長期避難, 帰還困難)', candidates: [temporary_housing, permanent_housing], note: '후쿠시마 자주피난자는 みなし仮設 거주 후 공급 종료 → 사실상 이주. 10년 이상 지속'}
  - {term: 'transitional shelter / T-shelter / abri transitoire', candidates: [temporary_housing, permanent_housing], note: '인도주의 용어상 업그레이드해 영구화 가능(progressive/core shelter). Quarantelli 단계와 1:1 대응 안 됨'}
  - {term: '응급 주택 수리 (住宅の応急修理)', candidates: [permanent_housing, none], note: '원 주택 복귀이므로 permanent에 가까우나 수리 대기 중 거주 형태가 별도 문제'}
  - {term: 'IDP camp / displacement site / 마니푸르 राहत शिविर', candidates: [temporary_sheltering, out_of_scope], note: '재난 vs 분쟁 이재 구분이 단계보다 먼저 필요(disaster 연결 단계에서 배제)'}
  - {term: 'protracted displacement, still living in …', candidates: [any], note: '장기화 표지는 단계 정보가 아님. 후속 명사(tent/trailer/hotel)로 단계 판정'}
