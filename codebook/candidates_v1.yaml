# 후보 용어 목록 v1 (CANDIDATES ONLY — 사전 변경 아님)
# - regex_v0.yaml은 재현율 감사 결과로만 바뀐다(CLAUDE.md). 이 파일은 감사 표본 설계·v1 제안의 입력이다.
# - 2026-10-21 범위 변경 반영: 주 분석 = emergency_sheltering + temporary_sheltering + temporary_housing.
# - 모든 항목 source: knowledge (문헌·기사로 미검증). 채택 전 감사에서 정밀도/재현율 확인 필요.
# - 패턴은 regex_v0.yaml 정규화 후 텍스트 기준: NFKC, IGNORECASE, tr은 turkish_lower(소문자 패턴),
#   ar은 ة→ه, أإآ→ا, 무타슈킬(ى는 미정규화이므로 [يى]로 씀).
# - tier1: 단독 통과 / tier2: disaster 용어 window(300자) 안에서만 통과 / cue: 필터에 쓰지 않음.
# - 카테고리: shelter_operation(기존 건물·집단 대피) / prolonged(대피·이재 장기화) /
#   existing_stock(기존 주택재고 활용 임시주거: 임대보조·호텔·가정위탁) / humanitarian(인도주의 부문 용어) /
#   problem_cues(운영 문제 단서어: 분류 프롬프트·감사 표본 층화용, 필터 미사용)
# - disaster_extra: 각 언어 disaster 정규식에 추가를 검토할 용어(대피 중심 범위 확장으로 필요).
# - fp: 예상 오탐 원천. dup_v0: v0에 이미 있는 항목과 겹치면 표시.
# - stage_hint는 힌트일 뿐이며 최종 단계 판정은 LLM 분류. 'ambiguous'는 하단 stage_ambiguity 참조.

meta:
  version: candidates_v1
  created: 2026-10-21
  status: unverified_candidates
  base_dictionary: regex_v0.yaml
  source_default: knowledge

ko:
  disaster_extra: '(대피\s?명령|피난|침수|산사태|화재\s?피해|재난)'
  shelter_operation:
    - {pattern: '이재민\s?(임시\s?)?(대피|주거|구호|수용)\s?(시설|소|장소)', tier: tier1, stage_hint: temporary_sheltering, fp: '드묾', source: knowledge}
    - {pattern: '(임시|긴급|응급|지정)\s?대피\s?(소|시설|장소)', tier: tier2, stage_hint: emergency_sheltering, fp: '민방위·전쟁(우크라이나·이스라엘) 대피소, 산악 대피소', source: knowledge}
    - {pattern: '대피소\s?(생활|운영|입소|퇴소|폐쇄|통합)', tier: tier2, stage_hint: temporary_sheltering, fp: '전쟁·북한 포격 대피 보도', source: knowledge}
    - {pattern: '(실내\s?)?체육관\s?(생활|대피|피난|숙식|노숙|임시\s?거처)', tier: tier2, stage_hint: temporary_sheltering, fp: '스포츠 기사(체육관 숙식 훈련)', source: knowledge}
    - {pattern: '(마을\s?회관|경로당|복지\s?회관|학교|교회|성당|사찰)\s?(에서|으로|에)?\s?(대피|피신|숙식|임시\s?거처)', tier: tier2, stage_hint: emergency_sheltering, fp: '민방위 훈련, 폭염 무더위쉼터', source: knowledge}
    - {pattern: '(칸막이|가림막)\s?(텐트|설치)|텐트\s?칸막이|재난\s?구호\s?텐트', tier: tier2, stage_hint: temporary_sheltering, fp: '사무실 칸막이, 캠핑용품 기사', source: knowledge}
    - {pattern: '(연수원|수련원|리조트|휴양림|호텔|모텔|찜질방)\s?(으로|에|에서)?\s?(임시\s?)?(대피|입소|이주|거처|숙박)', tier: tier2, stage_hint: temporary_sheltering, fp: '관광·숙박업 기사, 기업 연수 기사', source: knowledge}
    - {pattern: '임시\s?(거처|숙소|숙박\s?시설)', tier: tier2, stage_hint: ambiguous, fp: '노동자 숙소, 이사 공백기, 노숙인 정책', source: knowledge}
    - {pattern: '(응급\s?)?구호\s?(물품|세트|키트|품)', tier: tier2, stage_hint: emergency_sheltering, fp: '해외 원조(전쟁·난민), 연말 기부', source: knowledge}
  prolonged:
    - {pattern: '장기\s?(대피|피난|이재민|대피\s?생활)', tier: tier2, stage_hint: temporary_sheltering, fp: '전쟁 피란, 장기 입원', source: knowledge}
    - {pattern: '(대피|피난|이재민|체육관|대피소|컨테이너|텐트)\s?생활\s?\d+\s?(일|개월|달|년)', tier: tier2, stage_hint: ambiguous, fp: '드묾', source: knowledge}
    - {pattern: '(아직|여전히|아직도)\s?(체육관|대피소|컨테이너|임시\s?조립\s?주택|임시\s?거처|텐트)', tier: tier2, stage_hint: ambiguous, fp: '드묾', source: knowledge}
    - {pattern: '(집|보금자리|고향)\s?(으로|에)\s?(돌아가지|돌아갈\s?수\s?없|못\s?돌아)', tier: tier2, stage_hint: ambiguous, fp: '실향민·분단, 귀성 기사', source: knowledge}
    - {pattern: '귀가\s?(하지\s?)?못\w*|귀가\s?불가', tier: tier2, stage_hint: emergency_sheltering, fp: '교통 마비, 실종', source: knowledge}
  existing_stock:
    - {pattern: '이재민\s?(용\s?)?(임대|전세|공공\s?임대|주거비|임차)', tier: tier1, stage_hint: temporary_housing, fp: '드묾', source: knowledge}
    - {pattern: '(LH|엘에이치|국민|공공|매입)\s?임대\s?(주택|아파트)', tier: tier2, stage_hint: temporary_housing, fp: '일반 주택정책(청년·신혼부부)', source: knowledge}
    - {pattern: '전세\s?임대(\s?주택)?', tier: tier2, stage_hint: temporary_housing, fp: '전세사기·주택정책', source: knowledge}
    - {pattern: '(임대료|주거비|월세|임차료|숙박비)\s?(를\s?)?지원', tier: tier2, stage_hint: temporary_housing, fp: '청년 월세 지원 등 복지정책', source: knowledge}
    - {pattern: '긴급\s?주거\s?지원', tier: tier2, stage_hint: temporary_housing, fp: '긴급복지지원법 주거지원(빈곤)', source: knowledge}
    - {pattern: '(친척|지인|자녀|가족)\s?(집|댁)\s?(에|으로|에서)?\s?(머물|피신|대피|얹혀)', tier: tier2, stage_hint: temporary_sheltering, fp: '명절·일상 기사', source: knowledge}
  humanitarian:
    - {pattern: '(재난|이재민|구호)\s?(쉘터|셸터)', tier: tier1, stage_hint: emergency_sheltering, fp: '해외 원조 보도(전쟁)', source: knowledge}
    - {pattern: '(난민|피란민|이재민)\s?(캠프|촌)', tier: tier2, stage_hint: ambiguous, fp: '전쟁 난민 캠프', source: knowledge}
  problem_cues:
    - {pattern: '(과밀|비좁|북적|발\s?디딜\s?틈|새우잠|칼잠)', cue: overcrowding, tier: cue, source: knowledge}
    - {pattern: '(사생활|프라이버시|칸막이\s?없)', cue: privacy, tier: cue, source: knowledge}
    - {pattern: '(화장실|샤워|세면|위생|악취|빨래)', cue: sanitation, tier: cue, source: knowledge}
    - {pattern: '(추위|한파|난방|외풍|폭염|더위|냉방|결로|곰팡이|단열)', cue: thermal_envelope, tier: cue, source: knowledge}
    - {pattern: '(퇴소|퇴거|나가\s?달라|철거|폐쇄|통폐합|운영\s?종료)', cue: eviction_closure, tier: cue, source: knowledge}
    - {pattern: '(이주|이전|재배치|분산\s?수용)', cue: relocation, tier: cue, source: knowledge}
    - {pattern: '(감염|코로나|전염|노로|독감|집단\s?발병)', cue: health_infection, tier: cue, source: knowledge}
    - {pattern: '(불면|소음|우울|트라우마|스트레스|고독사|자살)', cue: mental_health, tier: cue, source: knowledge}
    - {pattern: '(형평성|차별|사각지대|지원\s?대상\s?(에서\s?)?제외|선정\s?기준)', cue: eligibility_equity, tier: cue, source: knowledge}
    - {pattern: '(갈등|민원|항의|농성|반발)', cue: conflict, tier: cue, source: knowledge}
    - {pattern: '(장애인|노인|어르신|임산부|영유아|반려\s?(동물|견)|외국인)', cue: vulnerable_groups, tier: cue, source: knowledge}

ja:
  disaster_extra: '(災害|水害|土砂|大雨|噴火|避難指示)'
  shelter_operation:
    - {pattern: '避難所(での)?(生活|運営|暮らし|環境)', tier: tier1, stage_hint: temporary_sheltering, fp: '防災訓練・防災計画記事', source: knowledge}
    - {pattern: '福祉避難所', tier: tier1, stage_hint: temporary_sheltering, fp: '平時の協定締結記事', source: knowledge}
    - {pattern: '(指定|一次|二次|広域|自主)避難所', tier: tier1, stage_hint: emergency_sheltering, fp: '防災計画', source: knowledge}
    - {pattern: '二次避難', tier: tier2, stage_hint: ambiguous, fp: '津波の二次避難(場所移動)', source: knowledge}
    - {pattern: 'みなし避難所', tier: tier1, stage_hint: temporary_sheltering, fp: '드묾', source: knowledge}
    - {pattern: '車中泊', tier: tier2, stage_hint: emergency_sheltering, fp: 'レジャー・車中泊旅行', source: knowledge}
    - {pattern: '(体育館|公民館|集会所)(で|に|での)(の)?(避難|生活|寝泊まり)', tier: tier2, stage_hint: temporary_sheltering, fp: '스포츠·합숙', source: knowledge}
    - {pattern: '段ボール(ベッド|間仕切り)|パーティション(を)?設置', tier: tier2, stage_hint: temporary_sheltering, fp: '제품·기업 PR, 선수촌 침대', source: knowledge}
    - {pattern: '(在宅|自主|広域|集団|分散)避難', tier: tier2, stage_hint: ambiguous, fp: '방재 계획', source: knowledge}
    - {pattern: 'テント(泊|村|生活)', tier: tier2, stage_hint: emergency_sheltering, fp: '캠핑', source: knowledge}
    - {pattern: '(ホテル|旅館|宿泊施設)(への|に|で)(の)?(二次)?避難', tier: tier2, stage_hint: temporary_sheltering, fp: '관광 기사', source: knowledge}
    - {pattern: '避難者(数|名簿|支援)', tier: tier2, stage_hint: emergency_sheltering, fp: '원전 피난자(대상 범위 내로 간주 가능)', source: knowledge}
  prolonged:
    - {pattern: '避難(生活|所生活)?(の|が)?長期化', tier: tier1, stage_hint: temporary_sheltering, fp: '드묾', source: knowledge}
    - {pattern: '長期避難(者)?', tier: tier1, stage_hint: ambiguous, fp: '드묾', source: knowledge}
    - {pattern: '仮設(住宅)?(での)?(生活|暮らし|住まい)(が|の)?長期化', tier: tier1, stage_hint: temporary_housing, fp: '드묾', source: knowledge}
    - {pattern: '(入居|供与)期限(の|を)?(再)?延長', tier: tier2, stage_hint: temporary_housing, fp: '공영주택 일반', source: knowledge}
    - {pattern: '(今なお|いまだ(に)?|今も)[^。]{0,20}(避難|仮設)', tier: tier2, stage_hint: ambiguous, fp: '드묾', source: knowledge}
    - {pattern: '帰還困難|帰還(の)?見通し', tier: tier2, stage_hint: ambiguous, fp: '원전 구역 행정(주거 무관)', source: knowledge}
  existing_stock:
    - {pattern: '賃貸型(応急)?(住宅|仮設)', tier: tier1, stage_hint: temporary_housing, fp: '드묾', source: knowledge}
    - {pattern: '(公営|市営|県営|雇用促進|公務員|国家公務員)住宅(への|に|を)?(一時)?(入居|提供)', tier: tier2, stage_hint: temporary_housing, fp: '평시 공영주택 정책', source: knowledge}
    - {pattern: '(家賃|住居費|宿泊費)(の)?(補助|支援|助成|負担)', tier: tier2, stage_hint: temporary_housing, fp: '일반 복지', source: knowledge}
    - {pattern: '(親族|親戚|知人)(宅|の家)(に|へ)?(避難|身を寄せ)', tier: tier2, stage_hint: temporary_sheltering, fp: '드묾', source: knowledge}
    - {pattern: '(住宅|自宅)(の)?応急修理', tier: tier2, stage_hint: ambiguous, fp: '드묾', source: knowledge}
  humanitarian:
    - {pattern: 'スフィア(基準|スタンダード)', tier: tier1, stage_hint: temporary_sheltering, fp: '해외 원조 보도', source: knowledge}
  problem_cues:
    - {pattern: '(雑魚寝|すし詰め|過密|密集|定員(を)?超)', cue: overcrowding, tier: cue, source: knowledge}
    - {pattern: '(プライバシー|着替え|更衣)', cue: privacy, tier: cue, source: knowledge}
    - {pattern: '(トイレ|衛生|断水|入浴|風呂|シャワー)', cue: sanitation, tier: cue, source: knowledge}
    - {pattern: '(寒さ|暑さ|熱中症|低体温|暖房|冷房|結露|カビ|断熱)', cue: thermal_envelope, tier: cue, source: knowledge}
    - {pattern: '(災害)?関連死|エコノミークラス症候群|生活不活発病', cue: health_mortality, tier: cue, source: knowledge}
    - {pattern: '(感染(症)?|ノロ|インフルエンザ|コロナ|クラスター)', cue: health_infection, tier: cue, source: knowledge}
    - {pattern: '(退去|立ち退き|追い出|閉鎖|集約|統合|解消)', cue: eviction_closure, tier: cue, source: knowledge}
    - {pattern: '(孤独死|孤立|引きこもり|自殺|心のケア)', cue: mental_health, tier: cue, source: knowledge}
    - {pattern: '(コミュニティ|抽選|入居者(の)?選定)', cue: community_allocation, tier: cue, source: knowledge}
    - {pattern: '(女性|性被害|性暴力|ＤＶ|DV|要配慮者|ペット)', cue: vulnerable_groups, tier: cue, source: knowledge}
    - {pattern: '(物資(不足)?|食料|炊き出し|おにぎり)', cue: supplies_food, tier: cue, source: knowledge}

tr:
  # turkish_lower 후 텍스트 기준: 패턴은 소문자, İ→i, I→ı
  disaster_extra: '(depremzede\w*|sel(zede|\s+felaket)\w*|yangın\w*|tahliye\w*|enkaz\w*)'
  shelter_operation:
    - {pattern: 'toplanma\s+alan\w*', tier: tier2, stage_hint: emergency_sheltering, fp: 'AFAD 대비 훈련·도시계획, 집회 장소', source: knowledge}
    - {pattern: 'yurt(lar)?\w*\s+(\w+\s+){0,2}(barın|konakla|yerleştiril|misafir\s+edil)\w*', tier: tier2, stage_hint: temporary_sheltering, fp: '학생 기숙사 부족 기사(2021~)', source: knowledge}
    - {pattern: 'okul(lar)?\w*\s+(\w+\s+){0,2}(barın|konakla|yerleştiril|misafir\s+edil)\w*', tier: tier2, stage_hint: emergency_sheltering, fp: '시리아 난민 수용', source: knowledge}
    - {pattern: '(spor\s+salon|kapalı\s+spor|cami|camii|cemevi)\w*\s+(\w+\s+){0,2}(barın|konakla|geceli|kal)\w*', tier: tier2, stage_hint: emergency_sheltering, fp: '스포츠, 종교 행사', source: knowledge}
    - {pattern: '(otel|misafirhane|öğretmenev|pansiyon|apart)\w*\s+(\w+\s+){0,2}(barın|konakla|yerleştiril|misafir\s+edil)\w*', tier: tier2, stage_hint: temporary_sheltering, fp: '관광·숙박업, 선거 숙박', source: knowledge}
    - {pattern: '(gemi|vagon|tren)\w*\s+(\w+\s+){0,2}(barın|konakla|geceli)\w*', tier: tier2, stage_hint: emergency_sheltering, fp: '드묾', source: knowledge}
    - {pattern: '(konteyner|çadır)\s+yaşam\s+(alan|merkez)\w*', tier: tier1, stage_hint: ambiguous, fp: '시리아 난민 캠프(AFAD 운영)', source: knowledge}
    - {pattern: 'geçici\s+yaşam\s+(alan|merkez)\w*', tier: tier1, stage_hint: ambiguous, fp: '시리아 난민 geçici barınma merkezi와 동일 계열', source: knowledge}
    - {pattern: 'barınma\s+(merkez|alan|ihtiyac|sorun)\w*', tier: tier2, stage_hint: ambiguous, fp: '난민, 학생 barınma sorunu', source: knowledge}
    - {pattern: 'barınak\w*', tier: tier2, stage_hint: emergency_sheltering, fp: '동물 보호소(hayvan barınağı) 매우 많음', source: knowledge}
    - {pattern: '(açıkta|sokakta|araç(lar)?(ın)?da|arabada)\s+(\w+\s+)?(kal|geceli|yat|uyu|sabahla)\w*', tier: tier2, stage_hint: emergency_sheltering, fp: '노숙인', source: knowledge}
  prolonged:
    - {pattern: '(aylardır|yıllardır|hâlâ|hala|halen|hâla)\s+(\w+\s+){0,3}(çadır|konteyner|barın|prefabrik)\w*', tier: tier2, stage_hint: ambiguous, fp: '드묾', source: knowledge}
    - {pattern: 'evler(i|ine)\s+(geri\s+)?dön(eme|emiyor|emedi|emeyen)\w*', tier: tier2, stage_hint: ambiguous, fp: '전쟁·분쟁', source: knowledge}
    - {pattern: 'yerinden\s+(edil|olmuş|olan)\w*', tier: tier2, stage_hint: ambiguous, fp: '시리아·분쟁 이재', source: knowledge}
  existing_stock:
    - {pattern: 'kira\s+(yardım|desteğ|destek)\w*', tier: tier2, stage_hint: temporary_housing, fp: '사회부조(sosyal yardım) 일반', source: knowledge}
    - {pattern: 'taşınma\s+(yardım|desteğ|destek)\w*', tier: tier2, stage_hint: temporary_housing, fp: '드묾', source: knowledge}
