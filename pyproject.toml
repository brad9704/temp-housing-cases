[project]
name = "temp-housing-cases"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi",
    "protego",
    "python-dotenv",
    "trafilatura",
    "ultimate-sitemap-parser",
    "regex",
    "pyyaml",
    "duckdb",
    "pyarrow",
    "zstandard",
    "datasketch",
    "pydantic>=2",
    "openai",
    "httpx",
    "krippendorff",
    "phonenumbers>=9.0.41",
]

[project.optional-dependencies]
js = ["playwright"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
